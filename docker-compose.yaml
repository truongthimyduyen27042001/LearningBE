# version: '3.8'

services: 
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: password123
      POSTGRES_USER: user123
      POSTGRES_DB: db123
    networks: 
      - default
    ports:
      - "5432:5432"
    expose: 
      - "5432" 
  app:
    build: .
    depends_on:
      - db
    image: my-node-app
    ports:
      - "13000:3000"